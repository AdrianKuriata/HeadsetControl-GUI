[package]
name = "headset-deck"
version = "0.1.0"
description = "Universal GUI for headsetcontrol"
authors = ["Adrian Kuriata"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AdrianKuriata/HeadsetControl-GUI"
edition = "2024"
rust-version = "1.85"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "headset_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "=0.0.12"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Linux only, and only ever reached through `backend/exec.rs`: the rest of the
# crate must build on Windows and macOS untouched (PROJECT.md §7). The `send`
# feature is what lets the monitor live on the hotplug thread.
[target.'cfg(target_os = "linux")'.dependencies]
udev = { version = "0.9", features = ["send"] }

# Applies to the lib and the bin alike, which is why it lives here rather than
# as a `#![forbid]` each crate root would have to repeat.
[lints.rust]
# The crate talks to hardware only through `headsetcontrol` and libudev, both of
# which are safe wrappers. Nothing here needs `unsafe`, so nothing may have it.
unsafe_code = "forbid"

[lints.clippy]
# On top of clippy's default `correctness`/`suspicious`/`complexity`/`style`.
# `make rs-lint` runs with `-D warnings`, so each of these is a build failure.
# Deliberately a short list: lints that fire inside `#[cfg(test)]` too (
# `unwrap_used`, `indexing_slicing`) would cost every assertion a `.get()` and
# buy nothing — the gate that matters for the shipped code is `unsafe_code`.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Release profile from the Tauri guide: a smaller, symbol-free bundle. `panic`
# is left at the default unwind — Tauri's own runtime relies on catching a panic
# in a command rather than aborting the whole app.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
