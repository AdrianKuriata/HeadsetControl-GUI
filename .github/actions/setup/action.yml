name: Set up build environment
description: >
  Tauri Linux system dependencies, Node with npm cache, Rust stable with a
  cargo cache — the shared prelude of every CI job that touches the app.

inputs:
  rust-components:
    description: Extra rustup components to install (comma separated)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Tauri 2 prerequisites for Linux — https://tauri.app/start/prerequisites/
    # Deliberately a plain install: caching the .debs saved ~10 s per job (the
    # download is fast; unpacking is the real cost and happens either way), which
    # did not justify the extra moving parts.
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          file \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libudev-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
        cache: npm

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    # Pinned to the commit the `stable` branch was at. That branch is also how
    # this action normally picks its toolchain, so pinning away from it means
    # naming the toolchain explicitly instead.
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      with:
        workspaces: ./src-tauri -> target
