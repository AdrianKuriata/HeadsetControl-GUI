name: CI

# lint → test → build (PROJECT.md §5), split by stack rather than by stage: a
# frontend-only PR gets its answer in well under a minute instead of waiting for
# WebKit packages and a Tauri dependency tree to compile. Every job runs the same
# `make` target a developer runs locally, so CI and the local gate cannot drift.
#
# Third-party actions are pinned to a commit SHA, never to a tag or a branch:
# both are mutable, and whoever can move one can run code in a job that holds the
# checkout and the caches. The comment after each `#` is the version that SHA was
# at when it was pinned — Dependabot bumps both together.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # ESLint + Prettier + vue-tsc + Vitest with coverage thresholds. No Rust,
      # no system packages — this is the fast signal.
      - run: make fe-check

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-llvm-cov
      # rustfmt + clippy + the coverage gate.
      - run: make rs-check
      # types.gen.ts is generated from Rust: a checked-in copy that no longer
      # matches the commands is a silently broken contract.
      - run: make gen-check

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Compile-only: bundling into deb/rpm/AppImage is the release workflow's
      # job (#21) and adds no signal to a per-PR gate. Runs in parallel with the
      # checks above — a release build is the long pole, so serialising it behind
      # them would only add its wall-clock to theirs.
      - run: make build-ci

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2
        with:
          tool: cargo-audit
      - run: npm ci
      # Dependabot opens the bumps; this is what makes an unfixed advisory
      # visible between them. See the Makefile for what the gate covers and
      # why the dev-dependency report is reported rather than enforced.
      - run: make audit

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The browser is a ~150 MB download; caching it keys on the lockfile, so a
      # Playwright bump fetches a fresh one and nothing else does.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Skips the download when the cache hit; still installs the system libs.
      - run: npx playwright install --with-deps chromium
      # Builds the app against MockBackend and drives it — no Tauri shell, no
      # hardware. The real IPC path is the smoke suite (#14).
      - run: make fe-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The husky commit-msg hook can be bypassed with --no-verify; this cannot.
      - run: make commitlint COMMITLINT_FROM=${{ github.event.pull_request.base.sha }} COMMITLINT_TO=${{ github.event.pull_request.head.sha }}
